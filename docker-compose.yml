services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - public_assets:/var/www/html/public
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - coqui

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    volumes:
      - public_assets:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - reverb
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - coqui

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    env_file:
      - .env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - coqui

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - coqui

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - coqui

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-coqui_platform}"
      POSTGRES_USER: "${DB_USERNAME:-coqui}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-coqui_secret}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-coqui} -d ${DB_DATABASE:-coqui_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coqui

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coqui

  coqui-worker:
    image: "${COQUI_WORKER_IMAGE:-ghcr.io/adamgreenwell/coqui-worker:latest}"
    profiles:
      - worker
    restart: unless-stopped
    environment:
      COQUI_WORKER_PORT: "8085"
      COQUI_WORKER_TOKEN: "${COQUI_WORKER_TOKEN:-}"
      COQUI_CALLBACK_URL: "http://nginx/api/internal/crawls/callback"
    networks:
      - coqui

volumes:
  postgres_data:
  redis_data:
  public_assets:
  storage_data:

networks:
  coqui:
    driver: bridge
