name: CI

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  plan:
    name: Roadmap & contract sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install JS dependencies
        run: npm install
      - name: Build roadmap artifacts
        run: npm run plan:build
      - name: Validate Coolify compose file
        run: |
          APP_KEY=base64:ci APP_URL=https://ci.example DB_PASSWORD=ci \
          REVERB_APP_KEY=ci REVERB_APP_SECRET=ci VITE_REVERB_HOST=ci.example \
            docker compose -f docker-compose.coolify.yml config --quiet
      - name: Typecheck & build frontend
        run: |
          npm run types:check
          npm run build

  laravel:
    name: Pint + Larastan + PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, bcmath, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate composer.json / composer.lock
        run: composer validate --strict --no-check-publish
      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          npm install
          npm run build
      - name: Code style (Pint)
        run: php vendor/bin/pint --test -v
      - name: Static analysis (PHPStan)
        run: php vendor/bin/phpstan analyse --memory-limit=1G
      - name: Tests (PHPUnit)
        run: |
          php vendor/bin/phpunit --display-warnings --fail-on-warning
          php artisan test
