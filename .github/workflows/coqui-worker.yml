name: coqui-worker

# Tests the worker on every change to it, and publishes the image to GHCR
# (ghcr.io/adamgreenwell/coqui-worker) from main.

on:
  push:
    branches: [main]
    paths:
      - 'docker/coqui-worker/**'
      - '.github/workflows/coqui-worker.yml'
  pull_request:
    paths:
      - 'docker/coqui-worker/**'
      - '.github/workflows/coqui-worker.yml'
  workflow_dispatch:

concurrency:
  group: coqui-worker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/coqui-worker

jobs:
  test:
    name: cargo test + clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker/coqui-worker
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            docker/coqui-worker/target
          key: coqui-worker-${{ runner.os }}-${{ hashFiles('docker/coqui-worker/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  image:
    name: Build image (publish on main)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: docker/coqui-worker
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=coqui-worker
          cache-to: type=gha,scope=coqui-worker,mode=max
